<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشاءالله - لوحة متابعة الرزق والالتزامات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">

<style>
    html, body {
        background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
    }

    body {
        font-family: 'Cairo', sans-serif;
        direction: rtl;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 25px 10px 15px 10px; 
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        max-width: 210mm;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    
    h1 { 
        text-align: center; 
        color: #1a237e; 
        font-size: clamp(15px, 4vw, 18px); 
        margin: 0; 
        padding: 8px 20px;
        border: 2px solid #1a237e;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(5px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    h2 { 
        font-size: 12px; 
        color: #ffffff; 
        text-align: center; 
        background: linear-gradient(90deg, #1a237e, #283593);
        padding: 5px 18px;
        margin: 4px 0 0 0;
        border-radius: 50px;
        width: fit-content;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #currentDateTime { 
        text-align: center; 
        font-size: 13px; 
        font-weight: bold;
        color: #333; 
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .pulse-dot {
        width: 8px;
        height: 8px;
        background: #27ae60;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
    }

    .table-container {
        width: 100%;
        border-radius: 12px;
        border: 1.5px solid #1a237e !important; 
        overflow: hidden;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    th, td {
        text-align: center !important;
        vertical-align: middle;
        word-wrap: break-word;
        padding: 10px 4px;
    }

    th {
        background: #1a237e !important;
        color: #ffffff !important;
        font-size: 11px;
        font-weight: bold;
        border: 0.5px solid rgba(255,255,255,0.2) !important; 
    }

    td {
        color: #000000 !important;
        font-size: 11px; 
        font-weight: bold;
        border: 0.5px solid rgba(26, 35, 126, 0.2) !important;
    }

    .green-numbers { color: #2e7d32 !important; }

    .platform-name {
        background: rgba(26, 35, 126, 0.05) !important;
        color: #1a237e !important;
    }

    /* تقسيم مساحات الجدول ليكون من خانتين فقط بالتساوي */
    .invest-table th:nth-child(1), .invest-table td:nth-child(1) { width: 50%; }
    .invest-table th:nth-child(2), .invest-table td:nth-child(2) { width: 50%; }

    .prayer-box-custom {
        width: 100%;
        text-align: center;
        font-size: 11px;
        font-weight: bold;
        color: #1a237e;
        background: rgba(255, 255, 255, 0.4);
        padding: 8px;
        border-radius: 10px;
        box-sizing: border-box;
        border: 1px dashed #1a237e;
    }

    * {
        -webkit-user-select: none;  
        user-select: none;         
        -webkit-touch-callout: none; 
    }
</style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-mosque"></i> اللهم بارك في رزق عائلتي</h1>
    
    <div id="currentDateTime">
        <div class="pulse-dot"></div>
        <span id="dateText"></span>
    </div>

    <h2><i class="fa-solid fa-chart-line"></i> حمودي سهوري لولو موكة خلو</h2>
    <div class="table-container">
        <table class="invest-table">
            <thead>
                <tr>
                    <th>البيان / الأصل</th>
                    <th>الإجمالي بالجنيه</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="platform-name">ذهب 131.1 جرام</td>
                    <td id="totalGoldEGP" class="green-numbers">جاري جلب السعر المباشر..</td>
                </tr>
                <tr>
                    <td class="platform-name">عقار safe</td>
                    <td class="green-numbers">300,000 جنيه</td>
                </tr>
                <tr>
                    <td class="platform-name">ثاندر</td>
                    <td class="green-numbers">50,000 جنيه</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="prayer-box-custom">
        🤲 اللهم لك الحمد والشكر على نعمك.
    </div>
</div>

<script>
let currentGoldPriceAED = 0;
let currentExchangeRate = 0;

function updateDateTime() {
    const now = new Date();
    const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    document.getElementById('dateText').innerText = `${String(now.getDate()).padStart(2, '0')} - ${months[now.getMonth()]} - ${now.getFullYear()}`;
}

async function fetchMarketData() {
    try {
        const [goldRes, rateRes] = await Promise.all([
            fetch("https://api.gold-api.com/price/XAU"),
            fetch("https://api.exchangerate-api.com/v4/latest/AED")
        ]);
        
        const goldData = await goldRes.json();
        currentGoldPriceAED = (goldData.price / 31.1035) * 3.67;
        
        const rateData = await rateRes.json();
        currentExchangeRate = rateData.rates.EGP;
        
        calculateGold(); 
    } catch (e) { 
        console.error("Error fetching market data");
        document.getElementById("totalGoldEGP").innerText = "خطأ في جلب بيانات السوق";
    }
}

function calculateGold() {
    if (currentGoldPriceAED > 0 && currentExchangeRate > 0) {
        const grams = 131.1;
        const totalAED = grams * currentGoldPriceAED;
        const goldValueEGP = totalAED * currentExchangeRate;
        document.getElementById("totalGoldEGP").innerText = goldValueEGP.toLocaleString(undefined, {maximumFractionDigits: 0}) + " جنيه";
    }
}

window.addEventListener("load", () => {
    updateDateTime();
    fetchMarketData(); 
    setInterval(fetchMarketData, 60000); // تحديث السعر تلقائياً كل دقيقة
});
</script>
</body>
</html>
